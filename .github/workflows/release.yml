name: Android 发布（草稿）· Windows 安装包已停止提供

# 由版本标签触发；只创建 **草稿**，不自动公开。
# 私钥/证书只存在受保护 Secrets 或签名服务，绝不进入仓库或日志。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 2.0.1（不带 v）'
        required: true

permissions:
  contents: write

env:
  DART_SDK_VERSION: "2.17.0"
  REPO: ChaosSurvivalProject/xqly-app

jobs:
  # ---------------------------------------------------------------- 1. 版本校验
  validate:
    name: 校验标签 / 版本号 / versionCode / 四段版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: 全量版本一致性
        run: |
          # workflow_dispatch 优先用显式输入；tag 推送时从 ref 去掉前导 v。
          TAG="${{ github.event.inputs.version }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME#v}"; fi
          CODE=$(grep -o 'android:versionCode="[0-9]*"' AndroidManifest.xml | grep -o '[0-9]*')
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=$CODE"   >> "$GITHUB_OUTPUT"
          test -n "$TAG" || { echo "::error::无法确定版本号"; exit 1; }
          # 标签必须是合法三段版本，且与六处真源一致
          echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'
          grep -qF "android:versionName=\"$TAG\"" AndroidManifest.xml
          grep -qF "VERSION_NAME = \"$TAG\"" src/cn/xqly/app/MainActivity.java
          grep -qF "versionName = '$TAG'" shared/lib/src/identity.dart
          grep -qF "V_NAME=$TAG" build.sh
          # 自 v2.4.0 起 Windows 不再产出安装包，其版本头仅作源码归档，
          # 不再作为版本一致性门禁的真源（避免归档源码漂移阻断 Android 发布）。
          # versionCode 必须比上一个 tag 递增
          PREV=$(git tag --list 'v*' --sort=-v:refname | grep -v "^v$TAG$" | head -1)
          if [ -n "$PREV" ]; then
            # 用 ${PREV} 显式定界：zsh 会把裸 $PREV:A 里的 :A 当作路径修饰符。
            PREV_CODE=$(git show "${PREV}:AndroidManifest.xml" | grep -o 'android:versionCode="[0-9]*"' | grep -o '[0-9]*')
            if [ -n "$PREV_CODE" ] && [ "$CODE" -le "$PREV_CODE" ]; then
              echo "::error::versionCode 未递增: $CODE <= $PREV_CODE ($PREV)"; exit 1
            fi
          fi
          echo "版本校验通过: $TAG / code=$CODE / Android only（Windows 安装包已停止提供）"

  # ---------------------------------------------------------------- 2. Android
  android:
    name: 构建 Android Release APK
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      # 注意：不再使用 android-actions/setup-android@v3 —— 该动作会硬装已废弃的
      # `tools` 包（sdkmanager 在新版 SDK 中已移除），导致每次构建在 setup 阶段失败。
      # ubuntu-latest 运行器已预装 Android SDK（ANDROID_HOME 已设），直接复用即可。
      - uses: dart-lang/setup-dart@v1
        # 必须写成块样式：flow mapping 里的 ${{ }} 会被 YAML 当成嵌套花括号。
        with:
          sdk: ${{ env.DART_SDK_VERSION }}
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: 准备 Android SDK（接受许可 + 安装锁定版本组件）
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: 从 Secrets 恢复发布密钥（缺失则不伪造）
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > /tmp/xqly-release.jks
            echo "KS=/tmp/xqly-release.jks" >> "$GITHUB_ENV"
            echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "SIGN_MODE=RELEASE" >> "$GITHUB_ENV"
          else
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，产物为测试签名"
            echo "SIGN_MODE=TEST" >> "$GITHUB_ENV"
          fi
      - name: 清理构建并执行 12 步门禁
        run: bash build.sh
      - name: 校验签名与版本
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose "dist/星穹旅驿.apk" | grep -E 'Verified using|Number of signers'
          "$BT/apksigner" verify --print-certs "dist/星穹旅驿.apk" | grep 'SHA-256'
          "$BT/aapt" dump badging "dist/星穹旅驿.apk" | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/星穹旅驿.apk
          if-no-files-found: error

  # ---------------------------------------------------------------- 3. 草稿发布
  # 自 v2.4.0 起不再构建 Windows 安装包：原 windows job 整体移除。
  # Win32 源码仍作为归档保留在 windows/ 目录，仅做源码审计，不产出分发物。
  draft:
    name: 生成清单 / SBOM / Release 草稿
    needs: [validate, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: android-apk, path: artifacts }
      - name: 按真实产物命名（不创建占位假文件）
        run: |
          V="${{ needs.validate.outputs.version }}"
          mkdir -p release
          cp artifacts/星穹旅驿.apk "release/xqly-app-v$V.apk"          # OTA 主资产（命名受更新链约束）
          # 资产名统一用 ASCII：GitHub 会把中文资产名归一成 default.apk，
          # 导致 SHA256SUMS.txt 里的文件名对不上（v2.0.0 发布时实证）。
          cp artifacts/星穹旅驿.apk "release/xqly-app-v$V-android-universal-release.apk"
          # 自 v2.4.0 起不再拷贝任何 Windows 安装包资产（MSIX / ZIP 均已停止提供）。
          ls -lh release/
      - name: 生成 SHA256SUMS.txt 与 SBOM.spdx.json
        run: python3 tools/gen_release_assets.py release "$V"
        env:
          V: ${{ needs.validate.outputs.version }}
      - name: 生成版本说明
        run: |
          V="${{ needs.validate.outputs.version }}"
          cp "docs/RELEASE_NOTES_$V.md" "release/RELEASE_NOTES_$V.md" 2>/dev/null \
            || printf '# 星穹旅驿 %s\n\n详见仓库 docs/。\n' "$V" > "release/RELEASE_NOTES_$V.md"
      - name: 创建 Release 草稿（不自动公开）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ needs.validate.outputs.version }}"
          # 若 v$V 已正式发布（非草稿），绝不覆盖——CI 测试签名产物会破坏可覆盖升级链。
          # 若只是上一次流水线留下的草稿，则删掉用本次最新产物重建（幂等，便于反复重跑）。
          if gh release view "v$V" --repo "$REPO" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "v$V" --repo "$REPO" --json isDraft --jq '.isDraft' 2>/dev/null)
            if [ "$IS_DRAFT" = "true" ]; then
              echo "::warning::v$V 已存在草稿，删除并以本次最新产物重建"
              gh release delete "v$V" --repo "$REPO" --yes
            else
              echo "::warning::v$V 已正式发布，跳过创建以免覆盖正式签名资产"
              exit 0
            fi
          fi
          # tag 已存在时不传 --target，避免与已有 tag 冲突；只有 tag 尚不存在的
          # 手工发布场景才用 --target 指定要打标签的提交。
          # 注：草稿 Release 的 html_url 形如 /releases/tag/untagged-<uuid> 是
          # GitHub 的固有形态（按 tag 查草稿会返回 404），Publish 后自动变为
          # /releases/tag/vX.Y.Z，不是本步骤的缺陷。
          if gh api "repos/$REPO/git/refs/tags/v$V" >/dev/null 2>&1; then
            gh release create "v$V" release/* --repo "$REPO" \
              --title "星穹旅驿 $V · Android" \
              --notes-file "release/RELEASE_NOTES_$V.md" --draft
          else
            gh release create "v$V" release/* --repo "$REPO" \
              --title "星穹旅驿 $V · Android" \
              --notes-file "release/RELEASE_NOTES_$V.md" --draft \
              --target "$GITHUB_SHA"
          fi
      - name: 像用户一样下载并验证哈希与签名
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ needs.validate.outputs.version }}"
          mkdir -p /tmp/verify
          gh release download "v$V" --repo "$REPO" --dir /tmp/verify
          (cd /tmp/verify && sha256sum -c SHA256SUMS.txt)
          echo "摘要校验通过"
          # 签名验证：自 v2.4.0 起只有 Android 资产，用 keytool 校验证书指纹
          if [ -f "/tmp/verify/xqly-app-v$V.apk" ]; then
            keytool -printcert -jarfile "/tmp/verify/xqly-app-v$V.apk" 2>/dev/null | grep -i SHA256 | head -2 || true
          fi
      - name: 输出发布摘要
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ needs.validate.outputs.version }}"
          gh release view "v$V" --repo "$REPO" --json isDraft,tagName,assets \
            --jq '"草稿=" + (.isDraft|tostring) + " tag=" + .tagName + " 资产=" + ([.assets[].name]|join(", "))'

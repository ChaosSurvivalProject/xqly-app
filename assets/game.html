<!doctype html>
<html lang="zh-CN" data-theme="dark" data-mode="glass">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星穹旅驿 · 方块合成</title>
<link rel="stylesheet" href="library.css">
<link rel="stylesheet" href="game.css">
<script src="bridge-shim.js"></script>
<script src="game-engine.js"></script>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <h1>星穹旅驿 · 方块合成</h1>
      <p>离线可玩 · 确定性规则 · 进度自动存档</p>
    </div>
    <button class="btn btn-icon glass" id="close" type="button" aria-label="关闭游戏">✕</button>
  </header>

  <section class="scores" aria-label="分数">
    <div class="score glass"><span>本局得分</span><b id="score" aria-live="polite">0</b></div>
    <div class="score best glass"><span>最高纪录</span><b id="best">0</b></div>
    <div class="score glass"><span>等级 / 连击</span><b id="level">0 / 0</b></div>
  </section>

  <section class="preview" aria-label="暂存与下一块">
    <div class="slot"><span>Hold 暂存</span><b id="hold">—</b><span class="shape" id="holdShape">◈</span></div>
    <div class="slot"><span>下一块</span><b id="next">2</b><span class="shape" id="nextShape">●</span></div>
  </section>

  <div class="board-box">
    <div class="board" id="board" role="grid" aria-label="4 乘 4 方块棋盘">
      <div class="mask" id="mask" role="dialog" aria-modal="true" aria-labelledby="maskTitle">
        <h2 id="maskTitle">旅程暂歇</h2>
        <p id="maskText">没有可合并的方块了，再开一局吧。</p>
        <button class="btn btn-primary glass" id="maskBtn" type="button">再来一局</button>
      </div>
    </div>
  </div>

  <div class="ctrl">
    <button class="btn glass" id="undo" type="button" aria-label="撤销（还剩 3 次）">↶ 撤销</button>
    <button class="btn glass" id="holdBtn" type="button" aria-label="暂存当前方块">⇄ 暂存</button>
    <button class="btn glass" id="daily" type="button" aria-label="开始每日挑战">◷ 每日</button>
    <button class="btn btn-primary glass" id="new" type="button" aria-label="开始新游戏">✦ 新局</button>
  </div>

  <div class="achv" id="achv" aria-label="成就"></div>
  <p class="hint">滑动 / 方向键 / WASD 移动 · <b>H</b> 暂存 · <b>U</b> 撤销 · <b>N</b> 新局 · <b>Esc</b> 关闭<br>
    相同方块合并升级，目标「星穹方块」2048 · 方块同时用颜色与形状区分</p>
</div>

<script>
(function () {
  'use strict';
  var G = window.XQGame;
  var $ = function (id) { return document.getElementById(id); };
  var board = $('board'), mask = $('mask');
  var KEY = 'xqly_game_v2_fallback';

  // 方块外观：颜色 + 名称 + 形状三重编码，不只靠颜色区分（色盲友好）
  var T = {
    2:{n:'草',s:'GRASS',c:'linear-gradient(145deg,#8ed35c,#4d9636)',t:'#123317'},
    4:{n:'土',s:'DIRT',c:'linear-gradient(145deg,#c79a6b,#8a5c38)',t:'#2e1a0c'},
    8:{n:'石',s:'STONE',c:'linear-gradient(145deg,#a9b3c2,#6d7889)',t:'#1b2230'},
    16:{n:'煤',s:'COAL',c:'linear-gradient(145deg,#69717e,#333a46)',t:'#ffffff'},
    32:{n:'铁',s:'IRON',c:'linear-gradient(145deg,#e6ebf3,#aeb9c9)',t:'#2b3340'},
    64:{n:'金',s:'GOLD',c:'linear-gradient(145deg,#ffdd8f,#e0a43a)',t:'#4a2c05'},
    128:{n:'红',s:'REDSTONE',c:'linear-gradient(145deg,#ff9d8c,#d64a3e)',t:'#3d0d08'},
    256:{n:'钻',s:'DIAMOND',c:'linear-gradient(145deg,#8cecf0,#2fa9c9)',t:'#063b48'},
    512:{n:'翠',s:'EMERALD',c:'linear-gradient(145deg,#79edb3,#28a674)',t:'#043824'},
    1024:{n:'合金',s:'NETHERITE',c:'linear-gradient(145deg,#d3b4ff,#7d55d4)',t:'#22103f'},
    2048:{n:'星穹',s:'ASTRAL',c:'linear-gradient(145deg,#fff0bd,#ffb43e)',t:'#4a2600'},
    4096:{n:'终焉',s:'THE END',c:'linear-gradient(145deg,#ffffff,#a9c0ff)',t:'#1b2450'},
    8192:{n:'∞',s:'INFINITY',c:'linear-gradient(145deg,#ffe9ff,#8ce8ff)',t:'#241640'}
  };

  var st = null, snap = null, paused = false, pendingDir = null;
  var daily = false, lastAch = 0;
  var sound = false, haptics = false;   // 默认不打扰，需要用户显式打开

  /* ---------- 存档：优先走宿主用户数据区，localStorage 仅作降级 ---------- */
  function localSave(obj) { try { localStorage.setItem(KEY, JSON.stringify(obj)); } catch (e) {} }
  function localLoad() { try { var v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function persist() {
    if (!st) return;
    var obj = G.save(st);
    localSave(obj);
    try { XQ.post('gameSave', { data: JSON.stringify(obj) }); } catch (e) {}
  }
  function applyState(s) {
    st = s; snap = G.snapshot(st);
    hideMask(); render();
  }

  /* ---------- 反馈 ---------- */
  function toast(msg) {
    var d = document.createElement('div');
    d.className = 'toast'; d.textContent = msg;
    document.body.appendChild(d);
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 1400);
  }
  function beep(freq) {
    if (!sound) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!beep.ctx) beep.ctx = new AC();
      var o = beep.ctx.createOscillator(), g = beep.ctx.createGain();
      o.type = 'sine'; o.frequency.value = freq; g.gain.value = .045;
      o.connect(g); g.connect(beep.ctx.destination);
      o.start(); o.stop(beep.ctx.currentTime + .07);
    } catch (e) {}
  }
  function buzz(ms) {
    if (!haptics) return;
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
  }

  /* ---------- 渲染 ---------- */
  function tileEl(v, merged) {
    var t = T[v] || T[8192];
    var d = document.createElement('div');
    d.className = 'tile' + (v > 4 ? ' two' : '') + (merged ? ' merge' : '');
    d.style.background = t.c; d.style.color = t.t;
    var e1 = document.createElement('em'); e1.textContent = t.n;
    var e2 = document.createElement('small'); e2.textContent = t.s;
    var e3 = document.createElement('span'); e3.className = 'shape';
    e3.textContent = G.shapeFor(v); e3.setAttribute('aria-hidden', 'true');
    d.appendChild(e1); d.appendChild(e2); d.appendChild(e3);
    return d;
  }
  function render(mergedMax) {
    if (!st) return;
    $('score').textContent = st.score;
    $('best').textContent = st.best;
    $('level').textContent = st.level + ' / ' + st.combo;
    $('hold').textContent = st.hold || '—';
    $('holdShape').textContent = st.hold ? G.shapeFor(st.hold) : '◈';
    $('next').textContent = st.next;
    $('nextShape').textContent = G.shapeFor(st.next);
    $('undo').setAttribute('aria-label', '撤销（还剩 ' + st.undosLeft + ' 次）');
    $('undo').textContent = '↶ 撤销 ' + st.undosLeft;

    var cells = board.querySelectorAll('.cell');
    for (var i = cells.length - 1; i >= 0; i--) cells[i].remove();
    for (var y = 0; y < 4; y++) for (var x = 0; x < 4; x++) {
      var c = document.createElement('div');
      c.className = 'cell'; c.setAttribute('role', 'gridcell');
      var v = st.board[y][x];
      if (v) c.appendChild(tileEl(v, !!mergedMax && v === mergedMax));
      board.insertBefore(c, mask);
    }

    var box = $('achv');
    box.innerHTML = '';
    (st.achievements || []).forEach(function (a) {
      var b = document.createElement('span'); b.className = 'badge on'; b.textContent = '✦ ' + a;
      box.appendChild(b);
    });
  }
  function showMask(title, text, btn, fn) {
    $('maskTitle').textContent = title;
    $('maskText').textContent = text;
    var b = $('maskBtn'); b.textContent = btn; b.onclick = fn;
    mask.classList.add('show'); b.focus();
  }
  function hideMask() { mask.classList.remove('show'); }

  /* ---------- 操作 ---------- */
  function doMove(dir) {
    if (!st) return;
    if (paused || mask.classList.contains('show')) { pendingDir = dir; return; }
    var before = G.snapshot(st);
    var r = G.move(st, dir);
    if (!r.changed) return;
    snap = before;
    render(r.merges > 0 ? G.maxTile(st.board) : 0); persist();
    if (r.merges > 0) { beep(440 + Math.min(r.merges, 6) * 70); buzz(12); }
    if ((st.achievements || []).length > lastAch) {
      lastAch = st.achievements.length;
      toast('成就解锁 · ' + st.achievements[lastAch - 1]);
    }
    if (r.wonNow) {
      showMask('合成星穹方块！', '你已抵达 2048，旅程仍可继续。', '继续挑战', function () {
        st.keepPlaying = true; hideMask(); persist();
      });
    } else if (r.overNow) {
      showMask('旅程暂歇', '没有可合并的方块了。本局 ' + st.score + ' 分，最高 ' + st.best + ' 分。',
               '再来一局', function () { startNew(false); });
    }
  }
  function startNew(isDaily) {
    daily = isDaily; lastAch = 0;
    var d = new Date();
    var seed = isDaily
      ? G.dailySeed(d.getFullYear(), d.getMonth() + 1, d.getDate())
      : (Date.now() | 0);
    applyState(G.newState(seed, st ? st.best : 0));
    persist();
    toast(isDaily ? '每日挑战 · ' + (d.getMonth() + 1) + '/' + d.getDate() + ' 固定种子' : '新的一局');
  }
  function doHold() {
    if (!st || paused) return;
    if (G.hold(st)) { render(); persist(); beep(330); }
    else toast('本回合已暂存过');
  }
  function doUndo() {
    if (!st || paused) return;
    if (!snap || st.undosLeft <= 0) { toast('没有可撤销的步骤'); return; }
    st = G.undo(st, snap);
    snap = G.snapshot(st);
    hideMask(); render(); persist();
  }

  /* ---------- 输入：滑动 / 鼠标拖拽 / 键盘，含简单输入缓冲 ---------- */
  function dirOf(dx, dy) {
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return null;
    return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  }
  var sx = 0, sy = 0, active = false;
  document.addEventListener('touchstart', function (e) {
    var t = e.touches[0]; sx = t.clientX; sy = t.clientY; active = true;
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (!active) return; active = false;
    var t = e.changedTouches[0], d = dirOf(t.clientX - sx, t.clientY - sy);
    if (d) doMove(d);
  }, { passive: true });
  var mx = 0, my = 0, mdown = false;
  document.addEventListener('mousedown', function (e) { mx = e.clientX; my = e.clientY; mdown = true; });
  document.addEventListener('mouseup', function (e) {
    if (!mdown) return; mdown = false;
    var d = dirOf(e.clientX - mx, e.clientY - my);
    if (d) doMove(d);
  });
  document.addEventListener('keydown', function (e) {
    var m = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
              a: 'left', d: 'right', w: 'up', s: 'down' };
    if (m[e.key]) { e.preventDefault(); doMove(m[e.key]); return; }
    if (e.key === 'h' || e.key === 'H') { e.preventDefault(); doHold(); }
    else if (e.key === 'u' || e.key === 'U') { e.preventDefault(); doUndo(); }
    else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); startNew(false); }
    else if (e.key === 'Escape') { e.preventDefault(); XQ.post('closeOverlay', {}); }
  });

  $('close').onclick = function () { persist(); XQ.post('closeOverlay', {}); };
  $('new').onclick = function () { startNew(false); };
  $('daily').onclick = function () { startNew(true); };
  $('undo').onclick = doUndo;
  $('holdBtn').onclick = doHold;

  /* ---------- 暂停 / 恢复：来电、切页、低内存都不丢局 ---------- */
  function pause() {
    if (paused) return;
    paused = true; persist();
    showMask('已暂停', '返回后从当前局面继续。', '继续游戏', resume);
  }
  function resume() {
    paused = false; hideMask();
    if (pendingDir) { var d = pendingDir; pendingDir = null; doMove(d); }
  }
  document.addEventListener('xqlypause', pause);
  document.addEventListener('xqlyresume', resume);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) pause();
  });

  /* ---------- 宿主消息 ---------- */
  window.addEventListener('xqly', function (e) {
    var m = e.detail;
    if (!m || !m.type) return;
    if (m.type === 'gameSave') {
      // 宿主用户数据区是权威存档；本地 localStorage 只是降级副本
      var data = m.data;
      applyState(G.restore(data || localLoad(), 0));
    } else if (m.type === 'state') {
      if (m.theme) document.documentElement.setAttribute('data-theme', m.theme);
      if (m.mode) document.documentElement.setAttribute('data-mode', m.mode);
      if (typeof m.sound === 'boolean') sound = m.sound;
      if (typeof m.haptics === 'boolean') haptics = m.haptics;
    }
  });

  // 兼容不支持 aspect-ratio 的老 WebView
  function fit() { var w = board.clientWidth; if (w > 0) board.style.height = w + 'px'; }
  window.addEventListener('resize', fit); fit();

  // 先渲染本机降级局面，保证无桥环境（普通浏览器）也立刻可玩；
  // 宿主存档到达后由 xqly:gameSave 覆盖为权威数据。
  applyState(G.restore(localLoad(), 0));
  XQ.post('gameLoad', {});
  XQ.post('getState', {});
})();
</script>
</body>
</html>

1tv.shop/index，20MB 三套产物）；后端容器 announcement-backend 只绑 127.0.0.1:5000（112MB 内存）；数据在 backend/data/（SQLite + uploads，卷持久化）；crontab 03:00 kb_sync / 04:00 staff_expire（已实跑 --check、--dry-run）；知识库首刷 15 篇 / 95 切片。\n\n顺手修掉的三个坑（都是本次才暴露的）\nbackend/Dockerfile 从来没构建成功过——构建上下文是仓库根，却写 COPY requirements.txt .，文件实际在 backend/。旧站是 venv + rc-service，所以一直没暴露。已改成 COPY backend/requirements.txt .，并补了根级 .dockerignore（否则 node_modules 会被塞进构建上下文）。\n1panel 的「静态网站」模板不生成 SPA 兜底、也不生成 include proxy/*.conf——不补的话整个前端只有首页能开、/api 全 502。已手工补进 conf.d 并落留档。\nadmin-frontend 本地 node_modules 缺依赖（highlight.js/html2canvas-pro/md-editor-v3 只在 package.json 里、没重装过），pnpm build 直接报 Can't resolve 'highlight.js/styles/github.css'。pnpm install 后构建通过。\n\n前端产物在本机构建再投放——那台机器只剩约 1GB 可用内存且与 MySQL/Redis/halo/napcat 同机，跑 Vite 会 OOM 连坐，这条也写进了 AGENTS.md。\n\n需要你手动做两件事\n后台管理员：账号 xqly-admin，初始密码在服务器\nGit：4 个提交已推到 GitHub main（613c814..6275972）——你的 SSH 这次通了。\n⚠️ 必须再提一次的遗留问题\n\n你选择在这台机器上继续部署，我照做了，但两件事请记在心上：\n\n后门还在运行（ring04h_office_bin PID 821 + /etc/ld.so.preload → libutilkeybd.so），root 权限、可隐藏文件与进程。这台机器上的 backend/.env（含 DeepSeek 与硅基流动 API Key）等于对攻击者可见，ai.floydzero.cloud（客服的上游）也在这台机器上。\ndpkg 现在是坏的（linux-image-6.8.0-110/142 卡在 half-configured）——我装 Node 时触发的，但根因是 rootkit：initramfs 钩子要复制被隐藏的那个 .so，必然失败。根治办法是重装系统；只修 dpkg 的话得先移除 /etc/ld.so.preload 并清掉 /var/adm/<uuid>，那就等于动手清后门了——要不要做、什么时候做，你说了算。Node 我是绕开 apt 用官方压缩包装的（/opt/node22），所以 apt 修不修都不影响本站在跑。\n赞\n1\n收藏\n1\n分享\n评论 4\n?\n登录后即可发表评论\n发表评论\n2\n2281461058\n10-03\n66\n赞\n1\n回复\n2\n2281461058\n10-03\n回复 @2281461058 收到\n赞\n回复\nx\nxqly-admin\n10-03\n欢迎大家发表看法😄\n赞\n2\n回复\n2\n2281461058\n10-03\n回复 @xqly-admin 666\n赞\n回复\n作者\nxqly-admin\n3\n发帖\n3\n获赞\n0\n粉丝\n关注\n打赏作者\n作者其他帖子\n消息中心上线啦！被点赞、被回复都会提醒你\n23\n生产环境更新完成\n10\n本项目由快跑云集团扶持\n\n快跑云集团 · 基础AIDC服务商\n\n定义下一代AIDC算力基线\n\n服务器信息\n首页\n服务器公告\n社区\n进入社区\n发布文章\n活动信息\n阵营内测\n联系我们\n联系服主\n加入我们\n\n© 2025-2026 星穹旅驿 Minecraft服务器 | 本服务器与Mojang及Microsoft无关\n\n联系我们: 3896301937@qq.com\n\n加入QQ群: 942235691", "chars": 2479}, {"path": "/forum/post/2", "name": "帖子 2", "  "xqly-admin", "avatar": null, "badge": "管理员"}, "viewCount": 23, "likeCount": 1, "commentCount": 4, "favoriteCount": 1, "publishTime": "2026-11-03T22:17:34", "createTime": "2026-10-03T15:47:48", "updateTime": "2026-11-03T22:17:38", "content": "## 部署完成 ✅ `https://xqly.xt91tv.shop` 已上线\n\n公网实测（走真实域名 + 公网 IP，证书校验通过）：\n\n| 路径 | 结果 |\n|---|---|\n| `/`（主站 SPA） | 200 · `星穹旅驿 \\| 生存服务器` |\n| `/announcements` `/forum` `/staff/{码}` `/team` | 200（深层路由返回 `index.html`，扫码直达可用） |\n| `/admin/` | 200 · pure-admin-thin |\n| `/wiki/`、`/wiki/for-new/factions/usage` | 200（cleanUrls 深层也命中正确页面） |\n| `/api/health` `/api/kb/info` `/api/monitor/servers` `/api/forum/*` | 200，包络 `code:0` 正常 |\n| 管理员登录 → `/api/auth/me` | JWT 有效，role=admin |\n| SSE 智能客服（经 nginx） | 44 帧、wiki 检索命中（0.63/0.61）、`[DONE]` 收尾；未登录 401 |\n| TLS | `*.xt91tv.shop`，Let's Encrypt，有效期至 **2026-12-24** |\n\n**落位**：1panel 静态网站（`/opt/1panel/www/sites/xqly.xt91tv.shop/index`，20MB 三套产物）；后端容器 `announcement-backend` 只绑 `127.0.0.1:5000`（112MB 内存）；数据在 `backend/data/`（SQLite + uploads，卷持久化）；crontab 03:00 `kb_sync` / 04:00 `staff_expire`（已实跑 `--check`、`--dry-run`）；知识库首刷 **15 篇 / 95 切片**。\n\n### 顺手修掉的三个坑（都是本次才暴露的）\n\n1. **`backend/Dockerfile` 从来没构建成功过**——构建上下文是仓库根，却写 `COPY requirements.txt .`，文件实际在 `backend/`。旧站是 venv + rc-service，所以一直没暴露。已改成 `COPY backend/requirements.txt .`，并补了根级 `.dockerignore`（否则 `node_modules` 会被塞进构建上下文）。\n2. **1panel 的「静态网站」模板不生成 SPA 兜底、也不生成 `include proxy/*.conf`**——不补的话整个前端只有首页能开、`/api` 全 502。已手工补进 `conf.d` 并落留档。\n3. **`admin-frontend` 本地 `node_modules` 缺依赖**（`highlight.js`/`html2canvas-pro`/`md-editor-v3` 只在 `package.json` 里、没重装过），`pnpm build` 直接报 `Can't resolve 'highlight.js/styles/github.css'`。`pnpm install` 后构建通过。\n\n前端产物**在本机构建再投放**——那台机器只剩约 1GB 可用内存且与 MySQL/Redis/halo/napcat 同机，跑 Vite 会 OOM 连坐，这条也写进了 `AGENTS.md`。\n\n### 需要你手动做两件事\n\n- **后台管理员**：账号 `xqly-admin`，初始密码在服务器 \n- **Git**：4 个提交已推到 GitHub `main`（`613c814..6275972`）——你的 SSH 这次通了。\n\n### ⚠️ 必须再提一次的遗留问题\n\n你选择在这台机器上继续部署，我照做了，但两件事请记在心上：\n\n1. **后门还在运行**（`ring04h_office_bin` PID 821 + `/etc/ld.so.preload` → `libutilkeybd.so`），root 权限、可隐藏文件与进程。**这台机器上的 `backend/.env`（含 DeepSeek 与硅基流动 API Key）等于对攻击者可见**，`ai.floydzero.cloud`（客服的上游）也在这台机器上。\n2. **dpkg 现在是坏的**（`linux-image-6.8.0-110/142` 卡在 half-configured）——我装 Node 时触发的，但根因是 rootkit：initramfs 钩子要复制被隐藏的那个 `.so`，必然失败。**根治办法是重装系统**；只修 dpkg 的话得先移除 `/etc/ld.so.preload` 并清掉 `/var/adm/<uuid>`，那就等于动手清后门了——要不要做、什么时候做，你说了算。Node 我是绕开 apt 用官方压缩包装的（`/opt/node22`），所以 `apt` 修不修都不影响本站在跑。", "contentType": "markdown", "reviewNote": "", "liked": false, "favorited": false}}, "article_2.json": {"code": 0, "message": "success", "data": {"id": 2, "title": "生产环境更新完成", "summary": "生产环境已更新完成。核对结果如下： 本次上线内容 服务器仓库从 推进到 ，共 4 个提交（3 个此前一直未上线的代码提交 + 1 个本次文档提交）： | 提交 | 内容 | | --- | --- |", "coverUrl": "", "thumbUrl": "", "category": {"id": 4, "code": "guide", "name": "攻略教程", "color": "#6366f1", "sortOrder": 3, "isSystem": 0, "isHidden": 0}, "tags": [{"id": 1, "name": "官方"}], "isTop": 0, "isFeatured": 0, "status": 1, "statusText": "已发布", "removeBy": "", "resubmitCount": 0, "author": {"id": 1, "name": "xqly-admin", "avatar": null, "badge": "管理员"}, "viewCount": 10, "likeCount": 0, "commentCount": 2, "favoriteCount": 0, "publishTime": "2026-10-05T12:37:27", "createTime": "2026-10-05T12:35:45", "updateTime": "2026-10-05T12:37:27", "content": "生产环境已更新完成。核对结果如下：\n\n## 本次上线内容\n\n服务器仓库从 `6275972` 推进到 `108be4d`，共 4 个提交（3 个此前一直未上线的代码提交 + 1 个本次文档提交）：\n\n| 提交 | 内容 |\n| --- | --- |\n| `86fca81` | 论坛帖子删除进回收站（`status=4`）+ 评论作者物理自删 |\n| `0dd4dfb` | 修社区评论区「点回复没反应」（之前生产上一直是坏的） |\n| `84d1f41` | 后台侧边菜单按功能模块分组 |\n| `108be4d` | 本次的部署留档与文档口径订正 |\n\n## 执行与验证\n\n- **备份先行**：生产库备份到 `/root/announcements.db.bak-20261005-1228`；crontab 备份到 `/root/crontab.bak-*`\n- **后端**：`docker compose up -d --build` 重建，启动日志实测回收站三列迁移三条 INFO，存量旧语义自删帖 **0 条**（无需担心保留期从旧 `update_time` 起算）；30 分钟内日志 **0 个 ERROR/Traceback**\n- **前端**：主站产物 → `index/`、后台产物 → `index/admin/`，**旧 hash 分片一个没删**（持旧 `index.html` 缓存的访客不会白屏）\n- **crontab**：新增 `0 5 * * *` 的 `forum_purge.py` 清理条目；`crontab -l` 与 `for-deploy/crontab` 留档 **md5 一致**（`68239407…`），服务器仓库已同步到同一提交，`md5sum` 在服务器上复核也一致\n- **线上实测**：`/`、`/forum`、`/forum/recycle`、`/forum/mine`、`/announcements`、`/admin/`、`/wiki/` 全 200；`/api/forum/stats` 有数据；新增的 `GET /my/articles?status=4`、`POST /articles/{id}/restore`、`DELETE /articles/{id}/purge`、`DELETE /comments/{id}` 无 token 均 401（路由已注册）；容器内 `forum_purge.py --dry-run` 正常。后端访问日志里已经能看到回收站页面在真实取数（`…&status=4 → 200`）\n\n## 两点需要你知道\n\n1. **后台回收站 UI 仍未实现**（按你的选择这次不补）：后台文章管理页的状态下拉只有 0/1/2/3，筛不出也操作不了回收站帖。后端 `admin/articles` 的 `status=4` 与 `admin/articles/{id}/restore` **都已支持**，只差页面。已记入 [TODO.md](TODO.md) 与上线清单注记，并在 [AGENTS.md](AGENTS.md) 里写明，避免下次被当漏洞\"顺手补\"。\n2. **GitHub 推送失败**：本机到 `github.com` 的 SSH（22 与 443 都试了）目前被网络 reset，HTTPS 又没有存凭据，所以 `108be4d` 还只在本地（工作区干净）。为了不留脏工作区，我用 `git bundle` 把同一个提交对象（SHA 完全一致）经生产机中转同步到了 `/opt/xqly-website`，所以你之后一旦能 push，两边天然对齐、不会冲突。等网络恢复后 `git push origin main` 即可；要我现在隔一会儿再重试也可以。\n\n顺带补了一个 [.gitattributes](.gitattributes)：禁止 `for-deploy/crontab` 做行尾转换——本机 `core.autocrlf=true`，否则哪天 git 重写该文件会把留档变成 CRLF，装进 cron 会直接报 `bad minute`。", "contentType": "markdown", "reviewNote": "", "liked": false, "favorited": false}}, "article_3.json": {"code": 0, "message": "success", "data": {"id": 3, "title": "消息中心上线啦！被点赞、被回复都会提醒你", "summary": "大家好！本次网站更新带来了全新的消息中心，以后在社区发帖、评论、互动，再也不会错过任何消息。 🔔 新增：消息中心 点击导航栏头像左侧的铃铛按钮即可打开，有未读消息时会显示红色角标。消息分为三个页签： ", "coverUrl": "/api/announcement/uploads/forum/202610/5297d46cae6b45b58b778fc27d71e9b0.png", "thumbUrl": "/api/announcement/uploads/forum/202610/5297d46cae6b45b58b778fc27d71e9b0.png", "category": {"id": 7, "code": "news", "name": "新闻活动", "color": "#ec4899", "sortOrder": 6, "isSystem": 0, "isHidden": 0}, "tags": [{"id": 2, "name": "网站更新公告"}], "isTop": 0, "isFeatured": 0, "status": 1, "statusText": "已发布", "removeBy": "", "resubmitCount": 0, "author": {"id": 1, "name": "xqly-admin", "avatar": null, "badge": "管理员"}, "viewCount": 23, "likeCount": 2, "commentCount": 5, "favoriteCount": 1, "publishTime": " <script>
const D=JSON.parse(document.getElementById('DATA').textContent);
const S=D.stats||{};
document.getElementById('stamp').textContent='快照时间 '+D.crawled_at+' · '+(S.static_files||0)+' 个资源文件';
const fmt=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':n>=1024?(n/1024).toFixed(0)+' KB':n+' B';
document.getElementById('stats').innerHTML=[
 ['静态资源',S.static_files||0],['镜像体积',fmt(S.static_bytes||0)],['页面快照',S.rendered_pages||0],
 ['接口数据',S.api_snapshots||0],['正文字符',S.text_chars||0],['收录文章',S.articles||0]
].map(x=>'<div class="st"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join('');

const TABS=[['pages','页面全文'],['api','接口数据'],['routes','站点导航'],['files','资源清单']];
let tab='pages', q='';
document.getElementById('tabs').innerHTML=TABS.map((t,i)=>'<div class="tab'+(i===0?' on':'')+'" data-k="'+t[0]+'">'+t[1]+'</div>').join('');
document.querySelectorAll('.tab').forEach(e=>e.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));e.classList.add('on');tab=e.dataset.k;render();
});
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();render();});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hit=(...xs)=>!q||xs.join(' ').toLowerCase().includes(q);
function render(){
  let h='';
  if(tab==='pages'){
    const arr=D.pages.filter(p=>hit(p.name,p.path,p.title,p.text));
    h=arr.map((p,i)=>'<div class="card"><h3><span class="ico">文</span>'+esc(p.name)+'</h3>'+
      '<div class="meta"><span class="pill">'+p.chars+' 字</span>'+esc(p.title)+'<br>'+esc(D.site+p.path)+'</div>'+
      '<div class="body" id="b'+i+'">'+esc(p.text)+'</div>'+
      '<div class="row"><span class="btn" onclick="toggle('+i+',this)">展开全文</span>'+
      '<span class="btn ghost" onclick="go(\''+esc(p.path)+'\')">在应用中打开</span></div></div>').join('');
  }else if(tab==='api'){
    const arr=Object.entries(D.api).filter(([k,v])=>hit(k,JSON.stringify(v)));
    h=arr.map(([k,v])=>'<div class="card"><h3><span class="ico">{}</span>'+esc(k)+'</h3>'+
      '<div class="meta">接口数据快照 · JSON</div><pre>'+esc(JSON.stringify(v,null,2))+'</pre></div>').join('');
  }else if(tab==='routes'){
    const arr=D.routes.filter(r=>hit(r.name,r.path));
    h=arr.map(r=>'<div class="card"><h3><span class="ico">↗</span>'+esc(r.name)+'</h3>'+
      '<div class="meta">'+esc(D.site+r.path)+'</div>'+
      '<div class="row"><span class="btn" onclick="go(\''+esc(r.path)+'\')">在应用中打开</span></div></div>').join('');
  }else{
    const arr=D.files.filter(f=>hit(f.path));
    h=arr.map(f=>'<div class="card" style="padding:10px 12px"><div class="meta" style="margin:0;font-size:10.5px">'+
      esc(f.path)+' <span class="pill" style="float:right">'+fmt(f.size)+'</span></div></div>').join('');
  }
  document.getElementById('list').innerHTML=h||'<div class="empty">没有匹配的内容</div>';
}
function toggle(i,el){
  const b=document.getElementById('b'+i);const open=b.classList.toggle('open');
  el.textContent=open?'收起':'展开全文';
}
function go(p){try{Android.openPage(p)}catch(e){location.href=p}}
render();
</script></body></html>
